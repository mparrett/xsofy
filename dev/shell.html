<!--
  xsofy bottom shell — drop into dist/ alongside index.html.
  The let-go bundle fetches this file on boot and injects it into
  #shell-bottom. Self-contained: scoped CSS + a tiny JS bridge that
  reads xsofy/startup + xsofy/stats and writes input through
  window._lgKey (which the bundle exposes; pushes bytes through the
  same SAB path that real keystrokes use).

  Portrait: D-pad and actions visible — full touch target set.
  Landscape: collapses to a single info strip; physical keys do the work.
-->
<style>
  #xsofy-shell {
    --bar-bg: #110d08;
    --bar-fg: #ede1c4;
    --bar-dim: #7a6d52;
    --bar-accent: #f5b041;
    --bar-rule: rgba(245, 176, 65, 0.18);

    display: flex;
    flex-direction: column;
    height: 100%;
    background: var(--bar-bg);
    color: var(--bar-fg);
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    user-select: none;
    -webkit-user-select: none;
    border-top: 1px solid var(--bar-rule);
  }

  #xsofy-shell .row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.45rem 0.75rem;
    flex-shrink: 0;
  }

  #xsofy-shell .info {
    border-bottom: 1px solid var(--bar-rule);
    justify-content: space-between;
    gap: 0.4rem;
    min-height: 28px;
  }
  #xsofy-shell .info .title {
    color: var(--bar-fg);
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1 1 auto;
    min-width: 0;
  }
  #xsofy-shell .info .quest {
    color: var(--bar-dim);
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 0 1 auto;
  }
  #xsofy-shell .info .stats {
    color: var(--bar-accent);
    flex: 0 0 auto;
    display: flex;
    gap: 0.7rem;
    font-variant-numeric: tabular-nums;
  }
  #xsofy-shell .info .stats .k { color: var(--bar-dim); }

  /* Touch controls only render in portrait. In landscape they're hidden;
     desktop users have a real keyboard. */
  #xsofy-shell .touch { display: none; }

  /* Portrait: relax the template's default 100:36 letterbox so the
     terminal gets a useful number of rows at the chunkier font size we
     apply via _lgSetFontSize below. ~55vh leaves the bar enough space
     for the D-pad to stay thumb-sized. Overrides the template rule via
     source order — shell.html is injected after the template's <style>. */
  @media (orientation: portrait) {
    body #terminal { height: 55vh; }
  }

  @media (orientation: portrait) {
    #xsofy-shell .touch {
      /* Outer grid: D-pad on the left, action column on the right. The
         3fr/2fr split fits both within viewport width on every phone size,
         and the inner grids fill their cells exactly — no overflow. The
         single-row template stretches the grid to the container's full
         height so buttons fill all available space. */
      display: grid;
      grid-template-columns: 3fr 2fr;
      grid-template-rows: 1fr;
      gap: 0.5rem;
      flex: 1;
      min-height: 0;
      padding: 0.5rem 0.6rem 0.7rem;
    }

    #xsofy-shell .pad,
    #xsofy-shell .actions {
      display: grid;
      gap: 0.3rem;
      min-width: 0;
      min-height: 0;
      /* Explicit 100% breaks the circular sizing: without it, 1fr rows
         resolve against .pad's content size, which is itself determined
         by the rows — so they collapse to button min-height. */
      height: 100%;
    }
    #xsofy-shell .pad {
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
    }
    #xsofy-shell .actions {
      grid-template-columns: 1fr 1fr;
      grid-auto-rows: 1fr;
    }
  }

  #xsofy-shell button {
    font-family: inherit;
    font-size: 14px;
    color: var(--bar-fg);
    background: rgba(245, 176, 65, 0.06);
    border: 1px solid var(--bar-rule);
    border-radius: 8px;
    padding: 0.55rem 0.5rem;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: rgba(245, 176, 65, 0.25);
    transition: background 0.08s ease, border-color 0.08s ease;
    min-height: 44px;
    min-width: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    line-height: 1.1;
  }
  #xsofy-shell button:active,
  #xsofy-shell button.pressed {
    background: rgba(245, 176, 65, 0.22);
    border-color: var(--bar-accent);
  }
  #xsofy-shell button .glyph { font-size: 16px; color: var(--bar-accent); }
  #xsofy-shell button .label { font-size: 10px; color: var(--bar-dim); letter-spacing: 0.05em; margin-top: 2px; }

  /* Font-size cycle lives in the info row. Compact tap target, intrinsic
     height (info row stays one line) — minimums and padding stripped so
     it doesn't push the rest of the row out of shape. */
  #xsofy-shell .font-cycle {
    flex: 0 0 auto;
    min-height: 0;
    min-width: 0;
    padding: 0.15rem 0.45rem;
    border-radius: 5px;
    font-size: 11px;
    line-height: 1.2;
    color: var(--bar-dim);
  }
  #xsofy-shell .font-cycle .glyph { font-size: 12px; color: var(--bar-fg); }
</style>

<div id="xsofy-shell">
  <div class="row info">
    <span class="title" id="xs-title">—</span>
    <span class="quest" id="xs-quest"></span>
    <span class="stats">
      <span><span class="k">d</span> <span id="xs-depth">·</span></span>
      <span><span class="k">hp</span> <span id="xs-hp">·</span>/<span id="xs-max">·</span></span>
      <span><span class="k">t</span> <span id="xs-turn">·</span></span>
    </span>
    <button class="font-cycle" id="xs-repeat-toggle" title="Toggle hold-to-repeat">
      <span class="glyph">↻</span><span id="xs-repeat-state">on</span>
    </button>
    <button class="font-cycle" id="xs-font-cycle" title="Cycle char size">
      <span class="glyph">A</span><span id="xs-font-px">22</span>
    </button>
  </div>

  <div class="row touch">
    <div class="pad" id="xs-pad">
      <button data-key="y"><span class="glyph">↖</span></button>
      <button data-key="k"><span class="glyph">↑</span></button>
      <button data-key="u"><span class="glyph">↗</span></button>
      <button data-key="h"><span class="glyph">←</span></button>
      <button data-key="."><span class="glyph">·</span><span class="label">WAIT</span></button>
      <button data-key="l"><span class="glyph">→</span></button>
      <button data-key="b"><span class="glyph">↙</span></button>
      <button data-key="j"><span class="glyph">↓</span></button>
      <button data-key="n"><span class="glyph">↘</span></button>
    </div>

    <div class="actions" id="xs-actions">
      <button data-key="g"><span class="glyph">g</span><span class="label">GET</span></button>
      <button data-key="i"><span class="glyph">i</span><span class="label">INV</span></button>
      <button data-key=">"><span class="glyph">&gt;</span><span class="label">DESCEND</span></button>
      <button data-key="f"><span class="glyph">f</span><span class="label">FIRE</span></button>
      <button data-key="r"><span class="glyph">r</span><span class="label">RUNES</span></button>
      <button data-key=""><span class="glyph">esc</span><span class="label">MENU</span></button>
    </div>
  </div>
</div>

<script>
  (function () {
    const $ = (id) => document.getElementById(id);
    const titleEl = $("xs-title");
    const questEl = $("xs-quest");
    const depthEl = $("xs-depth");
    const hpEl = $("xs-hp");
    const maxEl = $("xs-max");
    const turnEl = $("xs-turn");

    // Capitalize a quest-item name for the bar. Keep it terse.
    function nameOf(q) {
      if (!q) return "";
      if (typeof q === "string") return q;
      // Quest may be the item map directly (has :name) or a wrapper.
      const n = q.name || q[":name"] || q[":item"]?.name;
      return n ? `seeking ${n}` : "";
    }

    window.addEventListener("xsofy/startup", (e) => {
      const d = e.detail || {};
      titleEl.textContent = d.title || "—";
      questEl.textContent = nameOf(d.quest);
      // Reset stats on new run — they'll fill in after the first tick.
      hpEl.textContent = "·";
      maxEl.textContent = "·";
      depthEl.textContent = "1";
      turnEl.textContent = "0";
    });

    window.addEventListener("xsofy/stats", (e) => {
      const d = e.detail || {};
      if (d.hp != null) hpEl.textContent = d.hp;
      if (d["max-hp"] != null) maxEl.textContent = d["max-hp"];
      if (d.depth != null) depthEl.textContent = d.depth;
      if (d.turn != null) turnEl.textContent = d.turn;
    });

    // Pointer-driven key injection. Use pointerdown so taps register the
    // instant the finger lands, the way physical keys do. _lgKey accepts
    // raw bytes — the bundle pushes them through the same SAB path used
    // by xterm.js keystrokes, so no game-side code knows the difference.
    function press(btn) {
      const k = btn.dataset.key;
      if (!k || !window._lgKey) return;
      // Data attributes can't carry literal  — decode JS-escapes.
      const decoded = k.replace(/\\u([0-9a-fA-F]{4})/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
      window._lgKey(decoded);
      btn.classList.add("pressed");
      setTimeout(() => btn.classList.remove("pressed"), 90);
    }

    // Hold-to-repeat for D-pad buttons. After REPEAT_INITIAL ms of hold,
    // re-fire every REPEAT_INTERVAL ms until pointerup/cancel/leave. Scope
    // is movement only (the .pad set) — repeating GET/INV/FIRE/etc on a
    // long press is a footgun (wasted spells, repeated menu opens).
    const REPEAT_INITIAL = 250;
    const REPEAT_INTERVAL = 150;
    const REPEAT_LS_KEY = "xsofy/auto-repeat";
    const repeatToggleEl = $("xs-repeat-toggle");
    const repeatStateEl = $("xs-repeat-state");
    let repeatEnabled = (localStorage.getItem(REPEAT_LS_KEY) ?? "1") === "1";

    function paintRepeatState() {
      if (repeatStateEl) repeatStateEl.textContent = repeatEnabled ? "on" : "off";
      if (repeatToggleEl) repeatToggleEl.style.opacity = repeatEnabled ? "" : "0.5";
    }
    paintRepeatState();

    let cancelHoldRepeat = null;
    function startHoldRepeat(btn) {
      if (cancelHoldRepeat) { cancelHoldRepeat(); cancelHoldRepeat = null; }
      if (!repeatEnabled || !btn.closest(".pad")) return;
      let intervalId = null;
      const initialId = setTimeout(() => {
        intervalId = setInterval(() => press(btn), REPEAT_INTERVAL);
      }, REPEAT_INITIAL);
      cancelHoldRepeat = () => {
        clearTimeout(initialId);
        if (intervalId) clearInterval(intervalId);
      };
    }
    function stopHoldRepeat() {
      if (cancelHoldRepeat) { cancelHoldRepeat(); cancelHoldRepeat = null; }
    }

    document.querySelectorAll("#xsofy-shell button").forEach((btn) => {
      btn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        press(btn);
        startHoldRepeat(btn);
      });
      btn.addEventListener("pointerup", stopHoldRepeat);
      btn.addEventListener("pointerleave", stopHoldRepeat);
      btn.addEventListener("pointercancel", stopHoldRepeat);
      // Keep buttons from stealing focus from the terminal.
      btn.addEventListener("mousedown", (e) => e.preventDefault());
    });
    // Final safety net: if the pointer ends anywhere on the page (e.g. user
    // drags off the button and releases over the terminal), kill repeat.
    window.addEventListener("pointerup", stopHoldRepeat);
    window.addEventListener("pointercancel", stopHoldRepeat);

    repeatToggleEl?.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      e.stopPropagation();  // don't also start a repeat on the chip itself
      repeatEnabled = !repeatEnabled;
      localStorage.setItem(REPEAT_LS_KEY, repeatEnabled ? "1" : "0");
      paintRepeatState();
      stopHoldRepeat();
    });
    repeatToggleEl?.addEventListener("mousedown", (e) => e.preventDefault());

    // Font-size cycle. xterm's default 14 is unreadable on a 375px
    // viewport; 22 gives ~12px-wide cells. Sizes are kept short so the
    // cycle is predictable; tap the "A22" chip in the info row to bump.
    // Choice persists in localStorage; first ever load picks by
    // orientation (chunky for portrait, default for landscape).
    const FONT_SIZES = [14, 18, 22, 28];
    const LS_KEY = "xsofy/font-size";
    const cycleEl = $("xs-font-cycle");
    const fontPxEl = $("xs-font-px");

    function applyFontSize(n) {
      if (window._lgSetFontSize) window._lgSetFontSize(n);
      if (fontPxEl) fontPxEl.textContent = n;
    }

    function initFontSize() {
      let n = parseInt(localStorage.getItem(LS_KEY) || "", 10);
      if (!FONT_SIZES.includes(n)) {
        n = matchMedia("(orientation: portrait)").matches ? 22 : 14;
      }
      applyFontSize(n);
    }

    cycleEl?.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      const cur = parseInt(fontPxEl?.textContent || "14", 10);
      const i = FONT_SIZES.indexOf(cur);
      const next = FONT_SIZES[(i + 1) % FONT_SIZES.length];
      localStorage.setItem(LS_KEY, String(next));
      applyFontSize(next);
    });
    cycleEl?.addEventListener("mousedown", (e) => e.preventDefault());

    // _lgSetFontSize may not be defined yet at script execution time —
    // the bundle defines it during boot, before shell.html is fetched,
    // so calling immediately is safe. If the host loads the shell before
    // the bundle (unusual), this still works via the persisted value
    // being re-applied on the next user interaction.
    initFontSize();
  })();
</script>
