name: Deploy play to /play/ subpath

# Rebuilds the original fork `play` bundle and publishes it under the
# gh-pages `play/` subdirectory only. The live root site (deployed from
# `main`) and the `pr-preview/` dirs are never touched: peaceiris scopes
# every write to destination_dir, so it can only add/replace files under
# gh-pages/play/. Manual dispatch only.
on:
  workflow_dispatch:

# peaceiris pushes to gh-pages; only contents:write is needed (the old
# pages:/id-token: perms belonged to the actions/deploy-pages@v4 model,
# which is incompatible with this fork's gh-pages Pages source).
permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # The mparrett/let-go fork keeps the upstream module path
      # (github.com/nooga/let-go in go.mod), so `go install
      # github.com/mparrett/let-go@play` fails with a module-path
      # mismatch. Clone + go install . from inside the source tree
      # works around that. Also note: lg -w resolves the WASM-side
      # runtime through go.mod, and without LETGO_SRC it falls back
      # to the module proxy (= upstream nooga/let-go, missing the js
      # bridge primitives). LETGO_SRC pins the runtime to the fork.
      - name: Clone let-go fork (play branch)
        run: git clone --branch play --depth 1 https://github.com/mparrett/let-go.git $HOME/let-go

      - name: Install let-go binary
        run: cd $HOME/let-go && go install .

      - name: Build WASM (LETGO_SRC pins runtime to the fork)
        run: LETGO_SRC=$HOME/let-go let-go -w dist main.lg

      - name: Stage shell.html for the bottom-bar host
        run: cp dev/shell.html dist/

      - name: Stage build-info.json (written by deploy.sh)
        run: cp dev/build-info.json dist/ 2>/dev/null || true

      - name: Patch COI startup guard
        run: let-go tools/patch_wasm_coi.lg

      - name: Publish to gh-pages/play/ (scoped write; root + pr-preview untouched)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          destination_dir: play
