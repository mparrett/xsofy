name: Deploy to GitHub Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Branch publishing only needs write to contents (push to gh-pages). The old
# pages:/id-token: perms + the github-pages environment belonged to the
# Actions-deployment model we moved off of — which also sidesteps the
# environment protection rule that blocked tag deploys (#58).
permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/_build-wasm.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Serialize every gh-pages write (root deploys + PR previews share the
    # branch); never cancel a publish midway.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - name: Download built bundle
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: dist

      - name: Publish to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          # keep_files so deploying the root site does NOT wipe live /pr-N/
          # previews or pinned /vX.Y.Z/ version dirs (the kitten-game switcher).
          keep_files: true
