# Reusable WASM build — the single source of the build+gate steps, so the tag
# deploy and the PR preview can't drift. Builds dist/ from a given ref, runs the
# boot smoke (+ optional seeded e2e), and uploads dist/ as an artifact the caller
# publishes. This is the "build once on a clean runner, reproducibly" path — the
# reason the bundle is produced in CI from the pinned source, not committed by a
# local git hook (which would build from whatever toolchain a dev happened to have).
name: Build WASM bundle

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref/SHA to build. Empty = the caller's default checkout.
        required: false
        type: string
        default: ''
      run-e2e:
        description: Run the seeded e2e regression (slower). Off for previews.
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # Single-source the let-go version from .let-go-version so the deploy and
      # the test floor can't drift apart.
      - name: Resolve let-go version
        id: letgo
        run: echo "version=$(grep -v '^#' .let-go-version | grep . | head -1 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Check out let-go (pinned)
        uses: actions/checkout@v4
        with:
          repository: nooga/let-go
          ref: ${{ steps.letgo.outputs.version }}
          path: let-go-src

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install let-go
        run: go install github.com/nooga/let-go@${{ steps.letgo.outputs.version }}

      # LETGO_SRC pins the WASM runtime to the same release as the binary above;
      # without it `let-go -w` compiles the runtime from let-go@latest, which can
      # drift from the binary's worker protocol.
      - name: Build WASM
        env:
          LETGO_SRC: ${{ github.workspace }}/let-go-src
        run: let-go -w dist main.lg

      # GitHub Pages can't send COOP/COEP; this injects the service-worker shim
      # that establishes crossOriginIsolated client-side (needed for the SAB ring).
      - name: Patch COI startup guard
        run: let-go tools/patch_wasm_coi.lg

      - name: Set up Node (smoke gate)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install smoke dependencies
        working-directory: tests/browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Browser smoke (must boot to title screen)
        working-directory: tests/browser
        run: node smoke.mjs --dir ../../dist

      - name: E2E seeded regression (@playwright/test)
        if: ${{ inputs.run-e2e }}
        working-directory: tests/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium
          DIST="$GITHUB_WORKSPACE/dist" npx playwright test

      - name: Upload smoke failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: tests/browser/smoke-failure.png
          if-no-files-found: ignore

      - name: Upload built bundle
        uses: actions/upload-artifact@v4
        with:
          name: wasm-dist
          path: dist
          retention-days: 3
