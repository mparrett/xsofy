name: Build xsofy WASM bundle
description: >
  Build the xsofy WASM bundle the way it ships: shell-less (-w-shell none),
  then inject xsofy's own client shell (rune font + ?font=system, tools/xsofy-shell.html)
  and patch the COI service-worker shim. Single source of truth for the bundle
  build so the Pages deploy, the test smoke gate, and PR previews can't drift
  (the drift is what shipped the bare let-go shell to production).

inputs:
  dist:
    description: Output directory for the bundle.
    required: false
    default: dist
  letgo-src:
    description: >
      Path to a let-go source checkout (sets LETGO_SRC) so `lg -w` compiles the
      WASM runtime from the pinned release instead of let-go@latest. Omit to let
      the runtime resolve from the installed let-go (fine for a build smoke).
    required: false
    default: ''

runs:
  using: composite
  steps:
    # 0. TinyGo lane (lab experiment): ~1/3 the wasm of the stock-Go build.
    #    let-go v1.13.0 needs Go 1.27, which TinyGo 0.42 accepts, and TinyGo
    #    shells out to wasm-opt for -opt=z but does not ship it. TinyGo 0.43+
    #    wraps calls in panic-unwind catchers that overflow the browser worker's
    #    native stack on some descends (RangeError, seen 2026-10-27). lg builds
    #    with -panic=trap, so nothing recovers and the catchers are dead weight;
    #    0.44's -panic-unwind=none drops them. lg v1.13.0 can't pass extra
    #    tinygo flags, so a PATH wrapper adds it to every `tinygo build`.
    - name: Set up Go for TinyGo
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'
    - name: Install TinyGo and binaryen
      shell: bash
      run: |
        wget -q https://github.com/tinygo-org/tinygo/releases/download/v0.44.0/tinygo_0.44.0_amd64.deb
        sudo dpkg -i tinygo_0.44.0_amd64.deb
        wget -q https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
        tar -xzf binaryen-version_133-x86_64-linux.tar.gz -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
        rm -f tinygo_0.44.0_amd64.deb binaryen-version_133-x86_64-linux.tar.gz
        mkdir -p "$RUNNER_TEMP/tinygo-wrap"
        real="$(command -v tinygo)"
        printf '#!/bin/sh\nif [ "$1" = build ]; then shift; exec %s build -panic-unwind=none "$@"; fi\nexec %s "$@"\n' "$real" "$real" > "$RUNNER_TEMP/tinygo-wrap/tinygo"
        chmod +x "$RUNNER_TEMP/tinygo-wrap/tinygo"
        echo "$RUNNER_TEMP/tinygo-wrap" >> "$GITHUB_PATH"
        tinygo version

    # 1. Shell-less bundle: -w-shell none emits glue-only HTML exposing
    #    window.LetGoHost, so a project can inject its own client shell (#245).
    #    -w-wasm external emits main.wasm beside the HTML so the loader streams
    #    and compiles it, rather than re-running atob + DecompressionStream +
    #    instantiate on every load. A boot-CPU win, not a size win; external is
    #    slightly larger on the wire. Timings in nooga/xsofy#191.
    - name: Build WASM (shell-less)
      shell: bash
      env:
        LETGO_USE_TINYGO: '1'
      run: |
        if [ -n "${{ inputs.letgo-src }}" ]; then export LETGO_SRC="${{ inputs.letgo-src }}"; fi
        let-go -w "${{ inputs.dist }}" -w-shell none -w-wasm external main.lg

    # 2. Inject xsofy's own shell: rune font (Fairfax HD, OFL) + ?font=system.
    #    Without this the bundle ships let-go's generic shell (no rune face,
    #    no ?font=system) — the pre-existing production gap this fixes.
    - name: Inject xsofy client shell
      shell: bash
      env:
        XSOFY_WASM_INDEX: ${{ inputs.dist }}/index.html
      run: let-go tools/inject_shell.lg

    # 3. COI startup guard (SharedArrayBuffer needs cross-origin isolation).
    - name: Patch COI startup guard
      shell: bash
      env:
        XSOFY_WASM_INDEX: ${{ inputs.dist }}/index.html
      run: let-go tools/patch_wasm_coi.lg

    # 4. Build provenance for the shell's debug-bar chip. The shell fetches
    #    build-info.json; generating it here (the single bundle build) keeps the
    #    deploy, the smoke gate, and PR previews consistent and stops the fetch
    #    from 404-ing — the smoke gate counts any console error as a failure.
    - name: Write build-info.json
      shell: bash
      run: bash tools/write-build-info.sh "${{ inputs.dist }}"
